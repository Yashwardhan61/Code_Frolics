<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback | Yaado Ka Baksa</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-brown-50: #f7efe8;
      --brand-brown-200: #d6b89a;
      --brand-brown-400: #a5683f;
      --brand-brown-600: #704214;
      --brand-brown-800: #4a2800;
      --brand-accent: #8B4513;
      --brand-beige: #f5d0a0;
    }

    body {
      margin: 0;
      font-family: 'Dancing Script', cursive;
      color: var(--brand-brown-800);
      min-height: 100vh;
      background: var(--brand-brown-50);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* HEADER WITH LOGO */
    header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      color: var(--brand-brown-50);
      padding: 20px 0;
      background: linear-gradient(45deg, var(--brand-brown-600), var(--brand-accent));
      width: 100%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    header img {
      width: 65px;
      height: 65px;
      object-fit: contain;
      border-radius: 12px;
      background: #fff8f0;
      padding: 5px;
    }

    .header-text {
      text-align: center;
    }

    .header-text h1 {
      margin: 0;
      font-size: 2.5em;
    }

    .header-text p {
      font-size: 1.3em;
      margin-top: 5px;
    }

    .form-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 2px solid var(--brand-brown-200);
      border-radius: 15px;
      padding: 40px;
      max-width: 700px;
      width: 90%;
      margin: 50px auto;
      text-align: center;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.2);
    }

    .welcome-text {
      font-family: 'Dancing Script', cursive;
      background: linear-gradient(45deg, var(--brand-brown-600), var(--brand-brown-400));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2.5em;
      margin-bottom: 20px;
    }

    .input-field {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      font-size: 1.2em;
      border-radius: 8px;
      border: 2px solid var(--brand-brown-200);
      background: rgba(255, 255, 255, 0.9);
      transition: all 0.3s ease;
    }

    .input-field:focus {
      border-color: var(--brand-brown-400);
      box-shadow: 0 0 0 3px rgba(165, 104, 63, 0.2);
      outline: none;
    }

    .rating {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin: 15px 0;
      font-size: 2em;
      direction: ltr;
    }

    .rating input {
      display: none;
    }

    .rating label {
      color: var(--brand-brown-200);
      cursor: pointer;
      transition: color 0.3s;
    }

    .rating input:checked ~ label,
    .rating label:hover,
    .rating label:hover ~ label {
      color: var(--brand-accent);
    }

    .submit-button {
      background: linear-gradient(45deg, var(--brand-brown-600), var(--brand-accent));
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      font-size: 1.2em;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(139, 69, 19, 0.3);
    }

    footer {
      text-align: center;
      padding: 15px;
      color: var(--brand-brown-50);
      background: linear-gradient(45deg, var(--brand-brown-600), var(--brand-accent));
      width: 100%;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.3);
      position: relative;
    }
  </style>
</head>
<body>
  <header>
     <img src="../logo.jpeg" alt="Yaado ka baksa" class="w-full h-full object-cover">
    <div class="header-text">
      <h1>Yaado Ka Baksa</h1>
      <p>Your Feedback Matters to Us</p>
    </div>
  </header>

  <div class="form-container">
    <h2 class="welcome-text">Share Your Thoughts</h2>
    <form>
      <label for="name">Your Name:</label><br>
      <input type="text" id="name" name="name" class="input-field" placeholder="Enter your name" required><br>

      <label for="email">Your Email:</label><br>
      <input type="email" id="email" name="email" class="input-field" placeholder="Enter your email" required><br>

      <label for="feedback-type">Type of Feedback:</label><br>
      <select id="feedback-type" name="feedback-type" class="input-field">
        <option value="design">Website Design</option>
        <option value="navigation">Ease of Navigation</option>
        <option value="content">Content Quality</option>
        <option value="performance">Website Performance</option>
        <option value="feature">New Feature Suggestion</option>
        <option value="bug">Technical Issue</option>
        <option value="like">Positive Feedback</option>
        <option value="other">Other</option>
      </select><br>

      <div class="rating">
        <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
        <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
        <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
        <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
        <input type="radio" id="star5" name="rating" value="5"><label for="star5">★</label>
      </div>

      <label for="message">Your Message:</label><br>
      <textarea id="message" name="message" rows="5" class="input-field" placeholder="Write your feedback here..." required></textarea><br>

      <button type="submit" class="submit-button">Submit Feedback</button>
    </form>
  </div>

  <footer>
    <p>&copy; 2025 Yaado Ka Baksa. All Rights Reserved.</p>
  </footer>

  <script>
    document.querySelector('form').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Thank you for your feedback! We truly appreciate it ❤️');
      this.reset();
    });
  </script>
</body>
</html>
