<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Yaado ka baksa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-brown-50: #f7efe8;
            --brand-brown-200: #d6b89a;
            --brand-brown-400: #a5683f;
            --brand-brown-600: #704214;
            --brand-brown-800: #4a2800;
            --brand-accent: #8B4513;
            --brand-beige: #f5d0a0;
        }

        .choice-box {
            background: linear-gradient(45deg, var(--brand-brown-400), var(--brand-brown-600));
            border: 3px solid var(--brand-brown-800);
            transform: translateY(0);
            transition: all 0.3s ease;
        }

        .choice-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border-color: var(--brand-beige);
        }

        .welcome-text {
            font-family: 'Dancing Script', cursive;
            color: var(--brand-brown-800);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .bg-texture {
            background-image: url('../background.jpg');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="min-h-screen bg-texture">
    <!-- Semi-transparent overlay -->
    <div class="absolute inset-0 bg-black bg-opacity-70"></div>

    <!-- Main Content -->
    <div class="relative z-10 min-h-screen flex flex-col items-center justify-center p-6">
        <!-- Logo -->
        <div class="mb-8 flex items-center">
            <img src="../logo.jpeg" alt="Yaado ka baksa" class="w-16 h-16 rounded-lg shadow-lg">
            <h1 class="ml-4 text-4xl welcome-text text-white">Yaado ka baksa</h1>
        </div>

        <div class="text-center mb-12">
            <h2 class="text-3xl font-semibold text-white mb-4">Welcome to Your Memory Box</h2>
            <p class="text-gray-200 text-lg">Please tell us about yourself</p>
        </div>

        <div class="flex flex-col md:flex-row gap-8 w-full max-w-4xl mx-auto px-4">
            <!-- Existing User Box -->
            <a href="../regis/login.html" class="w-full md:w-1/2">
                <div class="choice-box rounded-xl p-8 text-center cursor-pointer h-full">
                    <div class="text-white mb-4">
                        <svg class="w-16 h-16 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                        <h3 class="text-2xl font-bold mb-2">Existing User</h3>
                        <p class="text-gray-200">Welcome back! Access your memories.</p>
                    </div>
                    <button class="bg-white text-brown-800 px-6 py-2 rounded-lg font-semibold hover:bg-gray-100 transition-colors">
                        Sign In
                    </button>
                </div>
            </a>

            <!-- New User Box -->
            <a href="register.html" class="w-full md:w-1/2">
                <div class="choice-box rounded-xl p-8 text-center cursor-pointer h-full">
                    <div class="text-white mb-4">
                        <svg class="w-16 h-16 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                        </svg>
                        <h3 class="text-2xl font-bold mb-2">New User</h3>
                        <p class="text-gray-200">Start your memory collection journey.</p>
                    </div>
                    <button class="bg-white text-brown-800 px-6 py-2 rounded-lg font-semibold hover:bg-gray-100 transition-colors">
                        Register
                    </button>
                </div>
            </a>
        </div>

        <!-- Back to Home Link -->
        <a href="../index.html" class="mt-12 text-white hover:text-gray-300 transition-colors">
            ← Back to welcome
        </a>
    </div>

    <script>
        // Add hover effects and animations if needed
        document.querySelectorAll('.choice-box').forEach(box => {
            box.addEventListener('mouseenter', () => {
                box.style.transform = 'translateY(-5px)';
            });
            
            box.addEventListener('mouseleave', () => {
                box.style.transform = 'translateY(0)';
            });
        });
    </script>
</body>
</html>
