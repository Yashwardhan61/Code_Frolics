<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Yaado ka baksa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-brown-50: #f7efe8;
            --brand-brown-200: #d6b89a;
            --brand-brown-400: #a5683f;
            --brand-brown-600: #704214;
            --brand-brown-800: #4a2800;
            --brand-accent: #8B4513;
            --brand-beige: #f5d0a0;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 2px solid var(--brand-brown-200);
        }

        .input-field {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid var(--brand-brown-200);
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: var(--brand-brown-400);
            box-shadow: 0 0 0 3px rgba(165, 104, 63, 0.2);
        }

        .submit-button {
            background: linear-gradient(45deg, var(--brand-brown-600), var(--brand-accent));
            transition: all 0.3s ease;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(139, 69, 19, 0.3);
        }

        .welcome-text {
            font-family: 'Dancing Script', cursive;
            background: linear-gradient(45deg, var(--brand-brown-600), var(--brand-brown-400));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="min-h-screen relative">
    <!-- Background Image with Overlay -->
    <div class="fixed inset-0 z-0">
        <img src="../background.jpg" alt="Background" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-black bg-opacity-70"></div>
    </div>

    <!-- Content -->
    <div class="relative z-10 min-h-screen flex flex-col items-center justify-center p-6">
        <!-- Logo and Title -->
        <div class="mb-8 text-center">
            <div class="flex items-center justify-center mb-4">
                <img src="../logo.jpeg" alt="Yaado ka baksa" class="w-16 h-16 rounded-lg shadow-lg">
                <h1 class="ml-4 text-4xl welcome-text">Yaado ka baksa</h1>
            </div>
            <p class="text-white text-lg">Create your treasure chest of memories</p>
        </div>

        <!-- Registration Form -->
        <div class="form-container w-full max-w-md p-8 rounded-2xl shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-center" style="color: var(--brand-brown-600)">Register</h2>
            
            <form id="registerForm" class="space-y-6">
                <!-- Name Input -->
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                    <input type="text" id="name" name="name" required
                        class="input-field w-full px-4 py-3 rounded-lg focus:outline-none"
                        placeholder="Enter your full name">
                </div>

                <!-- Email Input -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                    <input type="email" id="email" name="email" required
                        class="input-field w-full px-4 py-3 rounded-lg focus:outline-none"
                        placeholder="Enter your email">
                </div>

                <!-- Password Input -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input type="password" id="password" name="password" required
                        class="input-field w-full px-4 py-3 rounded-lg focus:outline-none"
                        placeholder="Create a password">
                </div>

                <!-- Confirm Password Input -->
                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required
                        class="input-field w-full px-4 py-3 rounded-lg focus:outline-none"
                        placeholder="Confirm your password">
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-button w-full py-3 text-white rounded-lg font-semibold">
                    Create Account
                </button>

                <!-- Login Link -->
                <p class="text-center text-gray-600 mt-4">
                    Already have an account? 
                    <a href="../regis/login.html" class="text-amber-700 hover:text-amber-800 font-semibold">Sign In</a>
                </p>
            </form>
        </div>

        <!-- Back Button -->
        <a href="check.html" class="mt-8 text-white hover:text-gray-300 transition-colors">
            ← Back
        </a>
    </div>

    <!-- Firebase Authentication Script -->
    <script type="module" src="auth.js"></script>
</body>
</html>
