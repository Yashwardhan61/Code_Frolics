spring:
  application:
    name: legacy-trunk

  datasource:
    url: jdbc:postgresql://localhost:5432/legacy_trunk
    username: ${USER}
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

server:
  port: 8080

# Application-specific configuration
app:
  upload-dir: ${user.home}/legacy-trunk-uploads
  firebase:
    # Set to path of your Firebase service account JSON, or "none" to skip
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT:none}
